# PRODUCTION routes.yaml for wondercabinetproductions.com: the exact file uploaded via
# Ghost Admin → Settings → Labs → Routes. Edit it here, review it in a PR, then upload
# this file as-is. Never upload a partial file: Ghost replaces the whole config, so a
# missing collection or taxonomy disappears from the site. See docs/ROUTES_CONFIG.md.
# Dev (ghost01) keeps its own copy at content/settings/routes.yaml on the LXC.

routes:
  # Island of Knowledge landing page (added 2026-10-24). A channel, not a collection:
  # IoK episodes are Wonder Cabinet posts and keep their /{slug}/ URLs and their place
  # on the homepage; this page only lists them. data: also 301s /tag/island-of-knowledge/
  # here. Uses tag.hbs until IoK gets its own template.
  /island-of-knowledge/:
    controller: channel
    filter: tag:island-of-knowledge
    template: tag
    data: tag.island-of-knowledge

  # The homepage river's full feed (#100). Every post except newsletters, 8 per page; page 1
  # repeats the homepage river. The homepage's "Load more episodes" fetches
  # /latest/page/N/ and links there without JS. limit must match the river's batch size in
  # home.hbs. A channel, so it lists posts without owning their URLs.
  /latest/:
    controller: channel
    filter: tag:-newsletter
    limit: 8
    template: latest

  # Wonder Cabinet-only archive (#100), linked from below the homepage river. Same posts
  # as the / collection. No data: here — the / collection already owns tag.wonder-cabinet.
  /episodes/:
    controller: channel
    filter: tag:wonder-cabinet+tag:-newsletter
    template: episodes

collections:
  # Homepage = Wonder Cabinet podcast landing page
  # Excludes newsletter posts to keep homepage focused on episodes
  /:
    permalink: /{slug}/
    filter: tag:wonder-cabinet+tag:-newsletter
    template: index
    data: tag.wonder-cabinet

  # Luminous - Episode theme style (simpler, no cabinet framing)
  /luminous/:
    permalink: /luminous/{slug}/
    filter: tag:luminous
    template: index-luminous
    data: tag.luminous

  # Newsletter collection
  /newsletter/:
    permalink: /newsletter/{slug}/
    filter: tag:newsletter
    template: newsletter
    data: tag.newsletter

taxonomies:
  tag: /tag/{slug}/
  author: /author/{slug}/
